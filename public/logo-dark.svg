<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" fill="none">
  <!-- YAMANASHI -->
  <text x="80" y="10" text-anchor="middle" font-family="'Noto Serif JP', serif" font-size="8" fill="#2D2D2D" letter-spacing="4" font-weight="400">YAMANASHI</text>
  <!-- KOME main text -->
  <g transform="translate(10, 14)">
    <!-- K -->
    <rect x="0" y="4" width="5" height="26" fill="#2D2D2D" rx="0.5"/>
    <polygon points="5,16 18,4 23,4 10,16" fill="#2D2D2D"/>
    <polygon points="5,16 18,30 23,30 10,16" fill="#2D2D2D"/>
    <!-- O with rice grain dot -->
    <circle cx="40" cy="17" r="12" stroke="#2D2D2D" stroke-width="4.5" fill="none"/>
    <ellipse cx="40" cy="3" rx="3.5" ry="4.5" fill="#2D2D2D" transform="rotate(-15 40 3)"/>
    <!-- M -->
    <rect x="60" y="4" width="5" height="26" fill="#2D2D2D" rx="0.5"/>
    <polygon points="65,4 76,18 73,18 65,7" fill="#2D2D2D"/>
    <polygon points="85,4 76,18 79,18 85,7" fill="#2D2D2D"/>
    <rect x="80" y="4" width="5" height="26" fill="#2D2D2D" rx="0.5"/>
    <!-- É -->
    <rect x="94" y="4" width="5" height="26" fill="#2D2D2D" rx="0.5"/>
    <rect x="94" y="4" width="19" height="4.5" fill="#2D2D2D" rx="0.5"/>
    <rect x="94" y="14" width="16" height="4.5" fill="#2D2D2D" rx="0.5"/>
    <rect x="94" y="25.5" width="19" height="4.5" fill="#2D2D2D" rx="0.5"/>
    <line x1="106" y1="0" x2="111" y2="-3.5" stroke="#2D2D2D" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- THE COTTAGE, TSUKIYONE -->
  <text x="80" y="54" text-anchor="middle" font-family="'Noto Serif JP', serif" font-size="7" fill="#2D2D2D" letter-spacing="3" font-weight="400">THE COTTAGE, TSUKIYONE</text>
</svg>
