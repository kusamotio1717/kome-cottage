<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <rect width="200" height="80" rx="4" fill="#2D2D2D"/>
  <!-- YAMANASHI -->
  <text x="100" y="18" text-anchor="middle" font-family="serif" font-size="9" fill="#ffffff" letter-spacing="3" font-weight="400">YAMANASHI</text>
  <!-- KOME main text -->
  <g transform="translate(20, 22)">
    <!-- K -->
    <rect x="0" y="4" width="6" height="30" fill="#ffffff" rx="1"/>
    <polygon points="6,18 20,4 26,4 12,18" fill="#ffffff"/>
    <polygon points="6,18 20,34 26,34 12,18" fill="#ffffff"/>
    <!-- O with rice grain dot -->
    <circle cx="45" cy="19" r="14" stroke="#ffffff" stroke-width="5" fill="none"/>
    <!-- Rice grain (dot) -->
    <ellipse cx="45" cy="3" rx="4" ry="5" fill="#ffffff" transform="rotate(-15 45 3)"/>
    <!-- M -->
    <rect x="68" y="4" width="6" height="30" fill="#ffffff" rx="1"/>
    <polygon points="74,4 86,20 82,20 74,8" fill="#ffffff"/>
    <polygon points="98,4 86,20 90,20 98,8" fill="#ffffff"/>
    <rect x="92" y="4" width="6" height="30" fill="#ffffff" rx="1"/>
    <!-- E -->
    <rect x="108" y="4" width="6" height="30" fill="#ffffff" rx="1"/>
    <rect x="108" y="4" width="22" height="5" fill="#ffffff" rx="1"/>
    <rect x="108" y="16" width="18" height="5" fill="#ffffff" rx="1"/>
    <rect x="108" y="29" width="22" height="5" fill="#ffffff" rx="1"/>
    <!-- accent line on E for é -->
    <line x1="122" y1="0" x2="128" y2="-4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- THE COTTAGE, TSUKIYONE -->
  <text x="100" y="68" text-anchor="middle" font-family="serif" font-size="7.5" fill="#ffffff" letter-spacing="2.5" font-weight="400">THE COTTAGE, TSUKIYONE</text>
</svg>
